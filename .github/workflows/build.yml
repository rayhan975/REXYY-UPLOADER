name: Build Rexyy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source
        run: |
          unzip -o RexyyUploader-FullSource.zip -d source

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd source/RexyyUploader/ReyyyUploader
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RexyyUploader-debug
          path: source/RexyyUploader/ReyyyUploader/app/build/outputs/apk/debug/app-debug.apk
