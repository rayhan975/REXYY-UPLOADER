
name: Build Rexyy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Extract source zip
        run: |
          ZIP_FILE="RexyyUploader-FullSource-v4.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: File $ZIP_FILE tidak ditemukan!"
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

      - name: Build APK
        run: |
          cd source/RexyyUploader-FullSource-v4.0
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RexyyUploader-debug
          path: source/RexyyUploader-FullSource-v4.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
