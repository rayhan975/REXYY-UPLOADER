name: Build Rexyy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Extract source zip
        run: |
          unzip -o RexyyUploader-FullSource.zip -d source
          echo "=== Struktur folder ==="
          find source -maxdepth 5 -name "build.gradle*" -o -name "gradlew" | head -20

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -name "settings.gradle.kts" -type f | head -1 | xargs dirname)
          echo "Project ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RexyyUploader-debug
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
