name: Build Rexyy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Extract source zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "ZIP ditemukan: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file zip di repo!"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source

      - name: Build APK
        run: |
          cd source/RexyyUploader-FullSource-v4.0
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RexyyUploader-debug
          path: source/RexyyUploader-FullSource-v4.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
